<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materi Pembelajaran Kelas 5 SD</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-page: #F0F4F8;
      --primary: #6C5CE7;
      --secondary: #00CEC9;
      --accent-pink: #FD79A8;
      --accent-yellow: #FFEAA7;
      --accent-orange: #FAB1A0;
      --text-dark: #2D3436;
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-viewport {
      width: 100%;
      max-width: 480px;
      background: #FFFFFF;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0,0,0,0.08);
    }

    /* CONTAINER SLIDE GESER */
    .slide-wrapper {
      display: flex;
      width: 200%; /* 2 Slide (Halaman 1 & Halaman 2) */
      min-height: 100vh;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Saat aktif berpindah ke slide 2 */
    .slide-wrapper.show-chapters {
      transform: translateX(-50%);
    }

    .slide-panel {
      width: 50%;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* HEADER */
    .header-box {
      background: linear-gradient(135deg, #6C5CE7, #a29bfe);
      padding: 20px;
      border-radius: var(--radius-lg);
      color: white;
      box-shadow: 0 8px 16px rgba(108, 92, 231, 0.25);
      position: relative;
      overflow: hidden;
    }

    .header-box::after {
      content: '🚀';
      position: absolute;
      right: 10px;
      bottom: -5px;
      font-size: 3.5rem;
      opacity: 0.3;
    }

    .header-box h1 {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .header-box p {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-top: 2px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* KARTU FOLDER PELAJARAN (FULL COLOR) */
    .subject-card {
      border-radius: var(--radius-lg);
      padding: 20px;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      transition: transform 0.15s ease;
      position: relative;
      overflow: hidden;
    }

    .subject-card:active {
      transform: scale(0.97);
    }

    /* WARNA SPESIFIK PELAJARAN */
    .card-inggris {
      background: linear-gradient(135deg, #FF7675 0%, #D63031 100%);
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .card-icon-bg {
      width: 52px;
      height: 52px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(5px);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }

    .card-info h3 {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .card-info p {
      font-size: 0.8rem;
      opacity: 0.9;
      margin-top: 2px;
    }

    .btn-slide-next {
      width: 38px;
      height: 38px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    /* SLIDE 2: HEADER NAVIGASI BALIK */
    .back-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 6px 0;
    }

    .btn-back {
      width: 40px;
      height: 40px;
      background: #E0E7FF;
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .back-nav h2 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    /* LIST BAB / CHAPTER (WARNA-WARNI & INTERAKTIF) */
    .chapter-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chapter-card {
      background: #FFF;
      border: 2.5px solid #FFEAA7;
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--text-dark);
      box-shadow: 0 4px 12px rgba(255, 234, 167, 0.4);
      transition: all 0.2s ease;
    }

    .chapter-card:active {
      transform: scale(0.97);
      background: #FFFDF0;
    }

    .chapter-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .chapter-badge {
      font-size: 1.8rem;
      background: #FFF3BF;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chapter-text h4 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .chapter-text p {
      font-size: 0.78rem;
      color: #636E72;
      margin-top: 2px;
    }

    .btn-play {
      background: var(--secondary);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(0, 206, 201, 0.3);
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="slide-wrapper" id="slideWrapper">
      
      <!-- SLIDE 1: DAFTAR MATA PELAJARAN -->
      <div class="slide-panel">
        <div class="header-box">
          <h1>Kelas 5 SD 🎒</h1>
          <p>Pilih pelajaran untuk mulai belajar</p>
        </div>

        <div class="section-title">
          <i class="fas fa-folder-open" style="color: var(--primary);"></i> Mata Pelajaran
        </div>

        <!-- KARTU BAHASA INGGRIS -->
        <div class="subject-card card-inggris" onclick="goToChapters()">
          <div class="card-left">
            <div class="card-icon-bg">
              <i class="fas fa-language"></i>
            </div>
            <div class="card-info">
              <h3>Bahasa Inggris</h3>
              <p>1 Bab Tersedia</p>
            </div>
          </div>
          <div class="btn-slide-next">
            <i class="fas fa-arrow-right"></i>
          </div>
        </div>
      </div>

      <!-- SLIDE 2: DAFTAR BAB / CHAPTER (GESER DARI KANAN) -->
      <div class="slide-panel">
        <div class="back-nav" onclick="goToSubjects()">
          <div class="btn-back">
            <i class="fas fa-arrow-left"></i>
          </div>
          <div>
            <h2>Bahasa Inggris</h2>
            <p style="font-size: 0.75rem; color: #636E72;">Kembali ke Pelajaran</p>
          </div>
        </div>

        <div class="section-title" style="margin-top: 8px;">
          <i class="fas fa-book-bookmark" style="color: var(--accent-pink);"></i> Pilih Bab Materi
        </div>

        <div class="chapter-list">
          <!-- CHAPTER 5 -->
          <a href="chapter-5.html" class="chapter-card">
            <div class="chapter-left">
              <div class="chapter-badge">🧢</div>
              <div class="chapter-text">
                <h4>Chapter 5: I Am Wearing a Hat</h4>
                <p>Materi & Kuis 20 Soal</p>
              </div>
            </div>
            <div class="btn-play">Mulai</div>
          </a>
        </div>
      </div>

    </div>
  </div>

  <script>
    function goToChapters() {
      document.getElementById('slideWrapper').classList.add('show-chapters');
    }

    function goToSubjects() {
      document.getElementById('slideWrapper').classList.remove('show-chapters');
    }
  </script>

</body>
</html>
