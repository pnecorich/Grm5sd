<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembelajaran Kelas 5 SD</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #64748B;
      --primary: #4338CA;
      --border: #E2E8F0;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* HEADER */
    header {
      margin-bottom: 8px;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* FOLDER MATA PELAJARAN */
    .subject-folder {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: all 0.2s ease;
    }

    .folder-header {
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .folder-header:active {
      background: #F1F5F9;
    }

    .folder-title {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .folder-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #EEF2FF;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .folder-title h3 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .folder-title p {
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    .toggle-icon {
      font-size: 0.9rem;
      color: var(--text-sub);
      transition: transform 0.25s ease;
    }

    /* ISI BAB / CHAPTER (HIDDEN DEFAULT) */
    .folder-content {
      display: none;
      border-top: 1px solid var(--border);
      background: #FAFAFC;
      padding: 12px 16px;
    }

    .subject-folder.open .folder-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .subject-folder.open .toggle-icon {
      transform: rotate(180deg);
    }

    /* ITEM BAB */
    .chapter-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--text-main);
      transition: background 0.15s ease;
    }

    .chapter-item:active {
      background: #EEF2FF;
      border-color: var(--primary);
    }

    .chapter-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chapter-emoji {
      font-size: 1.3rem;
    }

    .chapter-text h4 {
      font-size: 0.88rem;
      font-weight: 700;
    }

    .chapter-text p {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .btn-open {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      background: #EEF2FF;
      padding: 6px 12px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Materi Kelas 5 SD 📁</h1>
      <p>Pilih mata pelajaran untuk melihat bab</p>
    </header>

    <!-- FOLDER 1: BAHASA INGGRIS -->
    <div class="subject-folder" id="folder-inggris">
      <div class="folder-header" onclick="toggleFolder('folder-inggris')">
        <div class="folder-title">
          <div class="folder-icon">
            <i class="fas fa-language"></i>
          </div>
          <div>
            <h3>Bahasa Inggris</h3>
            <p>1 Bab Tersedia</p>
          </div>
        </div>
        <i class="fas fa-chevron-down toggle-icon"></i>
      </div>

      <div class="folder-content">
        <!-- BAB 5 (Materi & Kuis) -->
        <a href="chapter-5.html" class="chapter-item">
          <div class="chapter-left">
            <span class="chapter-emoji">🧢</span>
            <div class="chapter-text">
              <h4>Chapter 5: I Am Wearing a Hat</h4>
              <p>Materi & Kuis 20 Soal</p>
            </div>
          </div>
          <span class="btn-open">Buka</span>
        </a>
      </div>
    </div>

  </div>

  <script>
    function toggleFolder(id) {
      const folder = document.getElementById(id);
      folder.classList.toggle('open');
    }
  </script>

</body>
</html>
